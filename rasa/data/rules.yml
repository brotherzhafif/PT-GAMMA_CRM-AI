# Log Last Change: 28 Mei 2026
version: "3.1"

rules:
  - rule: Say greeting
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - action: utter_minta_rating

  - rule: Fetch doctor schedule from API
    steps:
      - intent: ask_schedule
      - action: action_fetch_schedule

  - rule: Fetch queue status from API
    steps:
      - intent: ask_queue
      - action: action_fetch_queue

  - rule: Answer services
    steps:
      - intent: ask_services
      - action: utter_services

  - rule: Answer location
    steps:
      - intent: ask_location
      - action: utter_location

  - rule: Answer cost
    steps:
      - intent: ask_cost
      - action: utter_cost

  - rule: Request human agent
    steps:
      - intent: request_human_agent
      - action: utter_request_human_agent

  - rule: Emergency response
    steps:
      - intent: emergency
      - action: utter_emergency
      - active_loop: null

  - rule: Mengubah data booking tengah jalan
    steps:
      - intent: booking_ubah_data
      - action: action_slot_reset_booking
      - action: utter_booking_tanya_tipe

  - rule: Batalkan booking kapan saja
    steps:
      - intent: booking_batalkan
      - action: action_booking_cancel
      - active_loop: null

  - rule: Reschedule booking
    steps:
      - intent: booking_reschedule
      - action: action_booking_reschedule

  - rule: Submit booking_form_baru selesai
    condition:
      - active_loop: booking_form_baru
    steps:
      - action: booking_form_baru
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_booking_form_baru_submit
      - action: action_booking_review

  - rule: Submit booking_form_lama selesai
    condition:
      - active_loop: booking_form_lama
    steps:
      - action: booking_form_lama
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_booking_form_lama_submit
      - action: action_booking_review
