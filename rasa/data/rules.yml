# Log Last Change: 5 Juni 2026
version: "3.1"

rules:
  - rule: Say greeting
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Fetch doctor schedule from API
    steps:
      - intent: ask_schedule
      - action: action_fetch_schedule

  - rule: Fetch queue status from API
    steps:
      - intent: ask_queue
      - action: action_fetch_queue

  - rule: Answer services
    steps:
      - intent: ask_services
      - action: utter_services

  - rule: Answer location
    steps:
      - intent: ask_location
      - action: utter_location

  - rule: Answer cost
    steps:
      - intent: ask_cost
      - action: utter_cost

  - rule: Request human agent
    steps:
      - intent: request_human_agent
      - action: utter_request_human_agent

  - rule: Emergency response
    steps:
      - intent: emergency
      - action: utter_emergency
      - active_loop: null

  # SUBMIT FORM (Hanya untuk mematikan form)
  - rule: Submit booking_form_baru selesai
    condition:
      - active_loop: booking_form_baru
    steps:
      - action: booking_form_baru
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_booking_form_baru_submit
      - action: action_booking_review

  - rule: Konfirmasi booking setelah review
    condition:
      - slot_was_set:
          - booking_step: review
      - active_loop: null
    steps:
      - intent: booking_konfirmasi
      - action: action_booking_confirm

  - rule: Ubah data setelah review
    condition:
      - slot_was_set:
          - booking_step: review
      - active_loop: null
    steps:
      - intent: booking_ubah_data
      - action: action_slot_reset_booking
      - action: action_start_booking

  - rule: Batalkan booking setelah review
    condition:
      - slot_was_set:
          - booking_step: review
      - active_loop: null
    steps:
      - intent: booking_batalkan
      - action: action_booking_cancel

  # BREAK-OUT: User minta booking baru saat form sedang aktif
  - rule: Booking baru saat form_baru aktif
    condition:
      - active_loop: booking_form_baru
    steps:
      - intent: intent_ingin_booking
      - action: action_booking_cancel
      - active_loop: null
      - action: action_start_booking

    # BPJS Rules
  - rule: Handle jawaban BPJS
    condition:
      - slot_was_set:
          - booking_step: tanya_bpjs
    steps:
      - intent: booking_pengguna_bpjs
      - action: action_handle_bpjs

  - rule: Handle jawaban non-BPJS
    condition:
      - slot_was_set:
          - booking_step: tanya_bpjs
    steps:
      - intent: booking_pengguna_umum
      - action: action_handle_bpjs

  - rule: Setelah handle bpjs tunggu input
    steps:
      - action: action_handle_bpjs
      - action: action_listen

  # Untuk siapa Rules
  - rule: Handle diri sendiri
    condition:
      - slot_was_set:
          - booking_step: tanya_untuk_siapa
    steps:
      - intent: intent_diri_sendiri
      - action: action_handle_untuk_siapa

  - rule: Handle orang lain
    condition:
      - slot_was_set:
          - booking_step: tanya_untuk_siapa
    steps:
      - intent: intent_orang_lain
      - action: action_handle_untuk_siapa
      - action: action_listen
