version: "3.1"

rules:
  - rule: Say greeting
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - action: utter_minta_rating

  - rule: Fetch doctor schedule from API
    steps:
      - intent: ask_schedule
      - action: action_fetch_schedule

  - rule: Fetch queue status from API
    steps:
      - intent: ask_queue
      - action: action_fetch_queue

  - rule: Answer services
    steps:
      - intent: ask_services
      - action: utter_services

  - rule: Answer location
    steps:
      - intent: ask_location
      - action: utter_location

  - rule: Answer cost
    steps:
      - intent: ask_cost
      - action: utter_cost

  - rule: Request human agent
    steps:
      - intent: request_human_agent
      - action: utter_request_human_agent

  - rule: Emergency response
    steps:
      - intent: emergency
      - action: utter_emergency

  - rule: Answer affirm
    steps:
      - intent: affirm
      - action: utter_affirm

  - rule: Answer deny
    steps:
      - intent: deny
      - action: utter_deny

  - rule: Fallback
    steps:
      - intent: nlu_fallback
      - action: utter_default

  - rule: Handle rating survey
    steps:
      - intent: intent_berikan_rating
      - action: utter_terima_kasih_rating

  # Trigger awal booking
  - rule: Mulai alur booking
    steps:
      - intent: intent_ingin_booking
      - action: action_start_booking

  #  Aktivasi form berdasarkan tipe pasien
  - rule: Aktifkan form pasien baru
    condition:
      - slot_was_set:
          - booking_tipe_pasien: baru
    steps:
      - intent: booking_pasien_baru
      - action: utter_booking_intro_baru
      - action: booking_form_baru
      - active_loop: booking_form_baru

  - rule: Aktifkan form pasien lama
    condition:
      - slot_was_set:
          - booking_tipe_pasien: lama
    steps:
      - intent: booking_pasien_lama
      - action: utter_booking_intro_lama
      - action: booking_form_lama
      - active_loop: booking_form_lama

  #  Submit form
  - rule: Submit form pasien baru
    condition:
      - active_loop: booking_form_baru
    steps:
      - action: booking_form_baru
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_booking_form_baru_submit
      - action: action_booking_review

  - rule: Submit form pasien lama
    condition:
      - active_loop: booking_form_lama
    steps:
      - action: booking_form_lama
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_booking_form_lama_submit
      - action: action_booking_review

  #  Konfirmasi
  - rule: Konfirmasi booking
    steps:
      - intent: booking_konfirmasi
      - action: action_booking_confirm

  # Ubah data booking
  - rule: Ubah data booking
    steps:
      - intent: booking_ubah_data
      - action: action_slot_reset_booking
      - action: utter_booking_tanya_tipe

  # Batal
  - rule: Batalkan booking kapan saja
    steps:
      - intent: booking_batalkan
      - action: action_booking_cancel

  # Reschedule
  - rule: Reschedule booking
    steps:
      - intent: booking_reschedule
      - action: utter_booking_reschedule_info
