  # ------------------------------------------------------------
  # REGEX: Pola ekspresi reguler
  # ------------------------------------------------------------
  - regex: nomor_antrian
    examples: |
      - \b(nomor|no\.?|nomer|no)\s*(antrian|antri|urut)\b
      - antrian\s*(ke|no\.?|nomor)?\s*\d{1,3}
      - \bno\.?\s*\d{1,3}\b

  - regex: jam_operasional
    examples: |
      - \bjam\s*\d{1,2}([:\.]\d{2})?\s*(pagi|siang|sore|malam|wib|wita|wit)?\b
      - \b\d{1,2}[:\.]\d{2}\s*(pagi|siang|sore|malam|wib|wita|wit)?\b
      - buka\s*(jam|pukul)\s*\d{1,2}
      - tutup\s*(jam|pukul)\s*\d{1,2}

  - regex: hari_dalam_seminggu
    examples: |
      - \b(senin|selasa|rabu|kamis|jumat|sabtu|minggu)\b
      - \b(hari\s+)?(ini|besok|lusa|kemarin)\b
      - \b(minggu|pekan)\s+(ini|depan|kemarin)\b

  - regex: sapaan_informal
    examples: |
      - \b(halo+|hai+|hi+|hey+|hei+|p+)\s*(kak|min|min|sis|bro|bang|mas|mbak|bu|pak)?\b
      - \b(permisi|prmisi|p)\s*(kak|min)?\b
      - \b(assalamualaikum|ass|asskum)\b

  - regex: negasi_informal
    examples: |
      - \b(ga|gak|gakk|ngga|nggak|kagak|engga|enggak)\s*(usah|mau|bisa|perlu|jadi|ada)\b
      - \b(gausah|gajadi|gabisa|gamau|gaperlu|gatau)\b

  - regex: singkatan_umum
    examples: |
      - \b(brp|skrg|bsk|udh|udah|blm|sdh|yg|dg|dgn|utk|krn|jd|spt|hrs)\b
      - \b(dr|dok|kl|kalo|gk|ga|sy|sya|mrk|kt|ky)\b

  - regex: penekanan_emosi
    examples: |
      - \b\w+(nya|deh|dong|nih|sih|loh|kok|kan|ya)\b
      - \b(banget|bgt|bgt|parah|abis|poll|pol)\b
      - ([a-z])\1{2,}

  - regex: biaya_harga
    examples: |
      - \b(rp\.?\s*\d+[\.,]?\d*)\b
      - \b\d+\s*(ribu|ratus|juta|rb|jt)\b
      - (harga|biaya|tarif|bayar|bayaran|ongkos)\s*(nya)?\s*(brp|berapa)

  - regex: pertanyaan_ketersediaan
    examples: |
      - (ada|tersedia|available)\s*\w+\s*(ga|gak|tidak|engga|enggak)\??
      - \w+\s*(ada|tersedia)\s*(ga|gak|tidak|kah|ngga)\??
      - (bisa|bs)\s*(pake|pakai|gunain|menggunakan)\s*\w+\s*(ga|gak|tidak)\??

  - regex: nik
    examples: |
      - \b\d{16}\b

  - regex: format_tanggal_indonesia
    examples: |
      - \b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}\b
      - \b\d{1,2}\s+(Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember)\s+\d{4}\b
