# Log Last Change: 28 Mei 2026
version: "3.1"

intents:
  - greet
  - goodbye
  - ask_schedule
  - ask_queue
  - ask_services
  - ask_location
  - ask_cost
  - request_human_agent
  - emergency
  - affirm
  - deny
  - nlu_fallback
  - intent_ingin_booking
  - intent_diri_sendiri
  - intent_orang_lain
  - intent_berikan_rating
  - booking_berikan_nik
  - booking_berikan_tgl_lahir
  - booking_berikan_keluhan
  - booking_berikan_tgl_kunjungan
  - booking_konfirmasi
  - booking_ubah_data
  - booking_batalkan
  - booking_reschedule

entities:
  - nik
  - tanggal_lahir
  - nama_lengkap
  - tanggal_kunjungan
  - keluhan
  - poli

slots:
  konteks_percakapan:
    type: text
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: intent_ingin_booking
        value: booking
      - type: from_intent
        intent: goodbye
        value: survey

  booking_untuk_siapa:
    type: categorical
    values:
      - diri sendiri
      - orang lain
    mappings:
      - type: from_intent
        intent: intent_diri_sendiri
        value: diri sendiri
      - type: from_intent
        intent: intent_orang_lain
        value: orang lain

  jadwalId:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  booking_nama:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: nama_lengkap
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_nama
      - type: from_text
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_nama
        not_intent: booking_batalkan

  booking_nik:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: nik
        intent: booking_berikan_nik
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_nik
      - type: from_text
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_nik
        not_intent: booking_batalkan

  booking_tgl_lahir:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: tanggal_lahir
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_tgl_lahir
      - type: from_text
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_tgl_lahir
        not_intent: booking_batalkan

  booking_keluhan:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: keluhan
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_keluhan
      - type: from_text
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_keluhan
        not_intent: booking_batalkan

  booking_tgl_kunjungan:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: tanggal_kunjungan
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_tgl_kunjungan
      - type: from_text
        conditions:
          - active_loop: booking_form_baru
            requested_slot: booking_tgl_kunjungan
        not_intent: booking_batalkan

  booking_step:
    type: categorical
    values:
      - tanya_untuk_siapa
      - form_baru
      - review
      - selesai
      - batalkan
    mappings:
      - type: custom

  booking_id_konfirmasi:
    type: text
    mappings:
      - type: custom

# Urutan Form Booking
forms:
  booking_form_baru:
    required_slots:
      - booking_nama
      - booking_nik
      - booking_tgl_lahir
      - booking_keluhan
      - booking_tgl_kunjungan

# Actions yang bisa dipanggil oleh rules/stories
actions:
  - action_fetch_schedule
  - action_fetch_queue
  - action_start_booking
  - action_handle_untuk_siapa
  - action_booking_form_baru_submit
  - action_booking_review
  - action_booking_confirm
  - action_booking_cancel
  - action_booking_reschedule
  - validate_booking_form_baru
  - action_slot_reset_booking

responses:
  utter_greet:
    - text: "Halo! 👋 Saya Hana, asisten virtual Klinik SmartClinic. Ada yang bisa saya bantu hari ini? Anda bisa tanya jadwal dokter, cek antrian, atau informasi layanan klinik."
    - text: "Selamat datang di Klinik SmartClinic! Saya Hana, asisten virtual yang siap membantu Anda 24/7. Silakan tanyakan apa saja seputar layanan klinik kami. 😊"

  utter_goodbye:
    - text: "Terima kasih telah menghubungi Klinik SmartClinic. Semoga sehat selalu! 🙏 Jangan ragu untuk menghubungi kami lagi jika ada pertanyaan."
    - text: "Sampai jumpa! Semoga hari Anda menyenangkan. Jika butuh bantuan lagi, Hana selalu siap membantu. 😊"

  utter_services:
    - text: "Berikut layanan yang tersedia di Klinik Smart Clinic 🏥\n\n*Poliklinik:*\n🩺 Poli Umum\n👶 Poli Anak (Sp.A)\n🫀 Poli Penyakit Dalam (Sp.PD)\n🤰 Poli Kandungan & Kebidanan (Sp.OG)\n✨ Poli Kulit & Kelamin (Sp.KK)\n👂 Poli THT (Sp.THT)\n👁️ Poli Mata (Sp.M)\n🧠 Poli Saraf (Sp.S)\n🥗 Poli Gizi Klinik (Sp.GK)\n👩 Poli KIA/KB\n🚨 UGD\n📋 Medical Check-Up (MCU)\n\n*Layanan Penunjang:*\n🔬 Laboratorium Klinik\n🩻 Radiologi (Rontgen/X-Ray)\n❤️ EKG (Rekam Jantung)\n\n*Layanan Khusus:*\n💉 Vaksinasi\n📊 Program Prolanis (BPJS)\n🏠 Home Visit\n📄 Surat Keterangan Sehat\n🧪 Rapid Test & Swab Antigen\n\nAda layanan tertentu yang ingin Bapak/Ibu ketahui lebih lanjut? 🙏"

  utter_location:
    - text: "📍 *Lokasi Klinik Smart Clinic:*\n\n🏠 Jl. Magelang No. 88, Sinduadi, Mlati, Sleman, DIY 55284\n🏪 *Patokan:* Sebelah utara UPN Veteran Yogyakarta, berhadapan dengan Indomaret\n🗺️ *Google Maps:* https://maps.google.com/?q=-7.7218,110.3568\n\nAda yang bisa Saya bantu lagi, Bapak/Ibu? 🙏"

  utter_cost:
    - text: "Untuk informasi biaya layanan, berikut gambaran umum:\n\n💰 Konsultasi Umum: Mulai dari Rp 50.000\n💰 Pendaftaran: Rp 25.000\n\nKlinik menerima pembayaran tunai, QRIS, dan BPJS.\n\nUntuk detail biaya spesifik, silakan hubungi admin klinik kami."

  utter_request_human_agent:
    - text: "Baik, Bapak/Ibu. Saya akan menghubungkan Anda dengan staf klinik kami yang akan segera membantu. Mohon tunggu sebentar. 🙏"

  utter_emergency:
    - text: "🚨 *KONDISI DARURAT*\n\nUntuk kondisi darurat, segera hubungi:\n- IGD Rumah Sakit terdekat\n- Ambulans: *118* atau *119*\n- Atau minta seseorang mengantar ke fasilitas darurat terdekat.\n\n⚠️ Saya tidak dapat menangani kondisi darurat melalui chat ini. Mohon segera cari pertolongan medis langsung!"

  utter_affirm:
    - text: "Baik, apakah ada hal lain yang bisa saya bantu? 😊"

  utter_deny:
    - text: "Baik, tidak masalah. Silakan hubungi saya lagi jika butuh bantuan. 🙏"

  utter_default:
    - text: "Mohon maaf, saya kurang memahami pertanyaan Anda. Saya bisa membantu untuk:\n\n1. 📅 Cek jadwal dokter\n2. 🔢 Cek antrian\n3. 🏥 Info layanan klinik\n\nSilakan coba tanyakan kembali."

  utter_minta_rating:
    - text: "Seberapa puas Anda dengan pelayanan saya hari ini? Balas dengan angka 1 (Sangat Tidak Puas) sampai 5 (Sangat Puas)."

  utter_terima_kasih_rating:
    - text: "Terima kasih atas penilaian Anda. 🙏😊"

  utter_ask_booking_untuk_siapa:
    - text: "Halo, saya lihat data diri Anda dengan NIK {nik} sudah tersimpan. Apakah Anda ingin mendaftar untuk *Diri Sendiri* atau untuk *Orang Lain*?"

  utter_booking_intro_baru:
    - text: |
        Selamat bergabung di Klinik SmartClinic! 😊

        Karena ini kunjungan pertama Anda, mohon lengkapi data berikut. Saya akan tanya satu per satu ya.

  utter_ask_booking_nama:
    - text: "📝 *Nama Lengkap* (sesuai KTP):\nSilakan ketik nama lengkap Anda."

  utter_ask_booking_nik:
    - text: "🪪 *NIK* (16 digit):\nSilakan ketik NIK Anda yang tertera di KTP."

  utter_ask_booking_tgl_lahir:
    - text: "🎂 *Tanggal Lahir*:\nSilakan ketik dalam format DD/MM/YYYY\n_(Contoh: 15/08/1995)_"

  utter_ask_booking_keluhan:
    - text: "🩺 *Keluhan yang dirasakan*:\nCeritakan keluhan utama Anda saat ini."

  utter_ask_booking_tgl_kunjungan:
    - text: "📅 *Rencana Tanggal Kunjungan*:\nKapan Anda berencana datang ke klinik?\n_(Contoh: 25/05/2026)_"

  utter_booking_nik_invalid:
    - text: "⚠️ NIK harus terdiri dari *16 digit angka*. Silakan cek kembali dan kirim ulang."

  utter_booking_tgl_invalid:
    - text: "⚠️ Format tanggal tidak dikenali. Gunakan format *DD/MM/YYYY*\n_(Contoh: 15/08/1995)_"

  utter_booking_tgl_kunjungan_invalid:
    - text: "⚠️ Tanggal kunjungan tidak valid. Gunakan format *DD/MM/YYYY*\n_(Contoh: 25/05/2026)_"

  utter_booking_batalkan:
    - text: |
        Baik, pendaftaran Anda telah dibatalkan. ❌

        Jika Anda ingin mendaftar kembali, ketik *booking* kapan saja. Semoga lekas sehat! 🙏

  utter_booking_reschedule_info:
    - text: |
        Untuk reschedule, silakan hubungi admin klinik kami:
        📞 *0812-XXXX-XXXX* (WhatsApp)
        🕐 Senin–Sabtu, 08.00–17.00 WIB

        Atau ketik *admin* untuk dihubungkan langsung. 🙏

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
